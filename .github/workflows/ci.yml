name: CI

# Type-check, and prove api/prompt-index.json still matches library/.
# The index is committed but regenerated on every deploy (vercel-build runs
# build:index), so a stale committed copy never reaches production — it just
# makes every subsequent `git status` noisy and every diff misleading. This
# catches "edited the library, forgot to rebuild" at the PR, not three commits
# later.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site # the whole deployable app lives here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run lint

      # server.ts and the Vercel function serve the same Express app; this pins
      # the route table so a dropped handler fails here, not in the browser.
      - name: API route table
        run: npm run test:routes

      # My Library is markdown files on disk; this round-trips the store in a
      # temp folder and checks an id can't name a path outside it.
      - name: My Library file store
        run: npm run test:my-library

      - name: Library path containment
        run: node lib/safe-path.test.mjs

      # The provenance scripts live at the repo root, outside site/. They are
      # dependency-free except for gray-matter, which npm ci above installed.
      # The library walk in upstream.test.mjs is what pins the `match:`
      # vocabulary, so a stray drift verdict in frontmatter fails here.
      - name: Provenance self-checks
        working-directory: .
        run: |
          node scripts/upstream.test.mjs
          node scripts/skill-frontmatter.test.mjs

      # homepage/ is a separate static site (GitHub Pages); this pins its required links.
      - name: Homepage links
        working-directory: .
        run: node scripts/homepage.test.mjs

      # Warns, never fails: rebuilding needs Chrome + Archify, which CI doesn't have. A
      # warning means code cited by docs/diagrams/library-data-flow.json changed since its
      # pinned commit; docs/diagrams/README.md says how to update it.
      - name: Diagram drift
        working-directory: .
        run: node scripts/build-diagram.mjs --hook | sed 's/^ISSUE:/::warning title=Diagram drift::ISSUE:/'

      # A rebuild on a clean checkout carries every unchanged entry's
      # lastModified (and buildTime) forward from the committed index, so it
      # must reproduce the committed file byte for byte. Any difference means
      # the library changed and nobody rebuilt — or the builder stopped being
      # reproducible, which is just as much a failure.
      - name: Prompt index is current
        run: |
          set -euo pipefail
          npm run build:index
          if ! git diff --exit-code --stat -- api/prompt-index.json; then
            echo "::error file=site/api/prompt-index.json::Stale prompt index — run 'npm run build:index' in site/ and commit the result"
            git diff -- api/prompt-index.json | head -50
            exit 1
          fi
          echo "prompt index matches library/ ($(jq .promptCount api/prompt-index.json) prompts)"
