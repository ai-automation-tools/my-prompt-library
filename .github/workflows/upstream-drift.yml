name: Upstream drift

# Weekly check of every vendored skill against its upstream. Opens or updates a
# single issue with the results — it never edits library content. The curation
# (categories, naming, what got kept) is the product; an auto-PR that reflowed
# 300 files into the wrong folders would destroy it. A human reads the table and
# decides what to resync.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies: the script is plain Node against the GitHub API, so
      # there is nothing to install and nothing to keep patched.
      - name: Check drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-upstream-drift.mjs --out drift.md

      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Upstream drift"
          # One rolling issue rather than a new one every Monday, which would
          # turn into 52 stale issues a year that nobody closes.
          NUM=$(gh issue list --state open --search "$TITLE in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title | startswith(\"$TITLE\"))][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file drift.md
            echo "commented on #$NUM"
          else
            gh issue create --title "$TITLE" --body-file drift.md
          fi
