<!doctype html>
<html lang="en" data-theme="mikesailab">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060606" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="My Prompt Library — a curated library of prompts, agents, skills and system prompts for AI coding tools, with a personal library on top." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>My Prompt Library</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the default.
      try {
        var t = localStorage.getItem('prompt-library-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
