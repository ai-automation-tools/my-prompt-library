<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060606" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Promptbook — a curated library of prompts, agents, skills and system prompts for AI coding tools, with a personal library on top." />
    <title>Promptbook</title>
    <script>
      // Pre-paint appearance (house style): dark unless the visitor picked light, plus the
      // chosen colour palette. Defaults and ids must match src/hooks/useTheme.ts.
      (function () {
        var t = 'dark';
        try { var s = localStorage.getItem('my-prompt-library.theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
        document.documentElement.classList.add(t);
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
        try {
          var p = localStorage.getItem('my-prompt-library.palette');
          if (/^(violet|emerald|ember|wine|ocean|slate|sand|solar|synthwave|sakura|mono)$/.test(p)) document.documentElement.setAttribute('data-palette', p);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Consent gate. One shared copy served from the org apex, so the banner and the
         notice it links to are maintained in a single place across every site. -->
    <script src="https://ai-automation-tools.dev/consent.js" defer></script>
  </body>
</html>
