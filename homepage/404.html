<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    // The app used to live on this host. Send old deep links (share links, /api/…) to the app host.
    if (location.pathname !== '/') location.replace('https://my-prompt-library-demo.ai-automation-tools.dev' + location.pathname + location.search + location.hash);
  </script>
  <title>Page moved · Promptbook</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#060606" />
  <script>
    (function () {
      var t = 'dark';
      try { var s = localStorage.getItem('my-prompt-library.theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
      document.documentElement.classList.add(t);
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg: #060606; --dots: rgba(255,255,255,.035); --fg: #f4f4f5; --fg-3: #a1a1aa; --fg-4: #71717a; --accent: #fbbf24;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    html.light { color-scheme: light; --bg: #fafafa; --dots: rgba(0,0,0,.05); --fg: #09090b; --fg-3: #52525b; --fg-4: #63636b; --accent: #b45309; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(var(--dots) 1.2px, transparent 0); background-size: 24px 24px; }
    main { max-width: 34rem; text-align: center; }
    img { width: 40px; height: 40px; }
    h1 { margin: 16px 0 0; font-size: 26px; letter-spacing: -.025em; font-weight: 650; }
    p { margin: 10px 0 0; color: var(--fg-3); }
    a { color: var(--accent); overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .mono { font-family: var(--mono); font-size: 13px; color: var(--fg-4); }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" width="40" height="40" />
    <h1>This page moved</h1>
    <p>The Promptbook app now lives at <a id="moved" href="https://my-prompt-library-demo.ai-automation-tools.dev/">my-prompt-library-demo.ai-automation-tools.dev</a>.</p>
    <p class="mono"><a href="/">Back to the homepage</a></p>
  </main>
</body>
</html>
